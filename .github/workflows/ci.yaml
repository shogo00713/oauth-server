name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Format
              run: pnpm format:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Test (unit + e2e)
              run: pnpm test
